apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: drill-stress-memory-order
  namespace: order
  annotations:
    drill.bookstore.io/fault-service: order-service
    drill.bookstore.io/category: memory-leak
    drill.bookstore.io/root-cause: "memory growth past order-service's 128Mi limit; container OOMKilled and restarted"
    drill.bookstore.io/expected-alerts: "PodMemoryNearLimit,ContainerOOMKilled,PodCrashLooping"
    drill.bookstore.io/duration: "6m"
spec:
  mode: one
  selector:
    namespaces: [order]
    labelSelectors:
      app: order-service
  containerNames: [order-service]
  stressors:
    memory:
      workers: 1
      size: "200MB"
  duration: "5m"
