apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: user
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service-policy
  namespace: user
spec:
  podSelector:
    matchLabels:
      app: user-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway
      ports:
        - port: 3000
    # Prometheus scrape (OBS-081): the monitoring EC2 scrapes /metrics through
    # the EKS API-server pod proxy, so connections arrive from the control-plane
    # ENIs, which live in the 4 EKS cluster subnets. Only the dedicated metrics
    # port (9464) is opened to them -- the app port stays restricted above.
    - from:
        - ipBlock:
            cidr: 170.20.3.0/24
        - ipBlock:
            cidr: 170.20.4.0/24
        - ipBlock:
            cidr: 170.20.5.0/24
        - ipBlock:
            cidr: 170.20.6.0/24
      ports:
        - port: 9464
  egress:
    - to:
        - ipBlock:
            cidr: 170.20.0.0/16
      ports:
        - port: 3306
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
