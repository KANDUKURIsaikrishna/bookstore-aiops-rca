apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  # Opt-in for Chaos Mesh (controllerManager.enableFilterNamespace) -- inert
  # unless Chaos Mesh is installed (var.enable_chaos_mesh). See k8s/chaos/.
  annotations:
    chaos-mesh.org/inject: enabled
  labels:
    name: gateway
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
